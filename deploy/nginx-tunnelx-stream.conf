# TunnelX — Nginx Stream (TLS Passthrough) Configuration
#
# This handles port 443 using SNI-based TLS passthrough.
# Nginx does NOT terminate TLS — it reads the SNI hostname from the
# ClientHello and forwards the raw TLS connection to tunnelxd, which
# manages its own wildcard certificates (ACME / Let's Encrypt).
#
# This file goes in /etc/nginx/stream.d/tunnelx.conf
# and is included by the top-level stream {} block in nginx.conf.
#
# Required: Nginx compiled with --with-stream and --with-stream_ssl_preread_module
# Check with: nginx -V 2>&1 | grep stream_ssl_preread

# Map SNI hostname to decide which upstream to use
map $ssl_preread_server_name $tunnelx_backend {
    # Match your tunnel domain and all wildcard subdomains
    ~^(.+\.)?tl\.codesky\.tech$    tunnelxd_tls;

    # Default: if you have other HTTPS sites on this server,
    # route them to a different backend or return empty to reject
    default                         tunnelxd_tls;
}

upstream tunnelxd_tls {
    server 127.0.0.1:8443;
}

server {
    listen 443;
    listen [::]:443;

    # Read the SNI hostname without decrypting
    ssl_preread on;

    # Forward raw TLS to the matched upstream
    proxy_pass $tunnelx_backend;

    # Pass the real client IP to tunnelxd via PROXY protocol (optional)
    # Uncomment below if tunnelxd supports PROXY protocol in the future:
    # proxy_protocol on;
}

