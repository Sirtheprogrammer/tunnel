name: Multi-OS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          # Linux
          - os: linux
            arch: amd64
            name: linux-amd64
            archive: tar.gz
          - os: linux
            arch: arm64
            name: linux-arm64
            archive: tar.gz
          # macOS (Darwin)
          - os: darwin
            arch: amd64
            name: darwin-amd64
            archive: tar.gz
          - os: darwin
            arch: arm64
            name: darwin-arm64
            archive: tar.gz
          # Windows
          - os: windows
            arch: amd64
            name: windows-amd64
            archive: zip
          - os: windows
            arch: arm64
            name: windows-arm64
            archive: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Build Binaries
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          EXT=""
          if [ "${{ matrix.target.os }}" = "windows" ]; then
            EXT=".exe"
          fi

          PKG_NAME="tunnelx-${VERSION}-${{ matrix.target.name }}"
          TARGET_DIR="dist/${PKG_NAME}"
          mkdir -p "$TARGET_DIR"

          LDFLAGS="-s -w -X main.version=${VERSION}"

          # Build tunnelx client
          go build -trimpath -ldflags "$LDFLAGS" -o "${TARGET_DIR}/tunnelx${EXT}" ./cmd/tunnelx

          # Build tunnelxd daemon
          go build -trimpath -ldflags "$LDFLAGS" -o "${TARGET_DIR}/tunnelxd${EXT}" ./cmd/tunnelxd

          # Copy docs
          cp README.md "${TARGET_DIR}/" || true
          cp LICENSE "${TARGET_DIR}/" || true

      - name: Package Archives
        run: |
          cd dist
          PKG_NAME="tunnelx-${{ steps.version.outputs.VERSION }}-${{ matrix.target.name }}"
          if [ "${{ matrix.target.archive }}" = "zip" ]; then
            zip -r "${PKG_NAME}.zip" "$PKG_NAME"
            echo "ASSET=${PKG_NAME}.zip" >> $GITHUB_ENV
          else
            tar -czf "${PKG_NAME}.tar.gz" "$PKG_NAME"
            echo "ASSET=${PKG_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: dist/${{ env.ASSET }}
          retention-days: 5

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute Checksums
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true

