<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}TunnelX — Instant Public HTTPS Tunnels{{end}}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" type="image/svg+xml" href="/static/icons8-tunnel.svg">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="brand">
        <img src="/static/icons8-tunnel.svg" alt="TunnelX Logo" width="24" height="24" style="vertical-align: middle;">
        <span>TunnelX</span>
        <span class="brand-badge">v1.0</span>
      </a>

      <div class="nav-links">
        <a href="https://github.com/Sirtheprogrammer/tunnel" target="_blank" rel="noopener noreferrer" class="github-link" aria-label="View TunnelX on GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.29-.01-1.04-.02-2.04-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6-.02 2.89-.02 3.29 0 .32.22.7.83.58C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span class="github-stars" id="github-stars" hidden>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.771l-7.416 3.642 1.48-8.279L0 9.306l8.332-1.151z"/>
            </svg>
            <span id="github-stars-count"></span>
          </span>
        </a>
        {{if .User}}
          <a href="/dashboard" class="nav-link">Dashboard</a>
          <form action="/auth/logout" method="POST" style="display:inline;">
            <button type="submit" class="btn btn-secondary btn-sm">Log out</button>
          </form>
        {{else}}
          <a href="/login" class="nav-link">Sign In</a>
          <a href="/register" class="btn btn-primary btn-sm">Get Started</a>
        {{end}}
      </div>
    </div>
  </nav>

  {{if .FlashError}}
    <div class="container container-flash">
      <div class="alert alert-error">
        <span>{{.FlashError}}</span>
      </div>
    </div>
  {{end}}

  {{if .FlashSuccess}}
    <div class="container container-flash">
      <div class="alert alert-success">
        <span>{{.FlashSuccess}}</span>
      </div>
    </div>
  {{end}}

  {{block "content" .}}{{end}}

  <footer>
    <div class="container" style="padding:0;">
      <p>TunnelX &middot; Self-Hosted Developer Tunneling Service &middot; Fast, Secure, CGO-Free</p>
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
