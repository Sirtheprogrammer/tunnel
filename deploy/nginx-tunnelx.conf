# TunnelX — Nginx Configuration
#
# This config puts Nginx in front of tunnelxd running in Docker.
#
# Architecture:
#   :80   → Nginx → 127.0.0.1:8080 (HTTP redirect handled by tunnelxd)
#   :443  → Nginx → 127.0.0.1:8443 (TLS passthrough — tunnelxd handles certs)
#   :7835 → Docker directly          (agent control, bypasses Nginx)
#
# Installation:
#   1. Copy this file:
#      sudo cp deploy/nginx-tunnelx.conf /etc/nginx/sites-available/tunnelx
#      sudo ln -s /etc/nginx/sites-available/tunnelx /etc/nginx/sites-enabled/tunnelx
#
#   2. Ensure the stream module is loaded. Add to /etc/nginx/nginx.conf
#      (OUTSIDE the http {} block, at the top level):
#
#      stream {
#          include /etc/nginx/stream.d/*.conf;
#      }
#
#   3. Copy the stream config:
#      sudo mkdir -p /etc/nginx/stream.d
#      sudo cp deploy/nginx-tunnelx-stream.conf /etc/nginx/stream.d/tunnelx.conf
#
#   4. Remove default site if it conflicts on port 80:
#      sudo rm /etc/nginx/sites-enabled/default
#
#   5. Test and reload:
#      sudo nginx -t
#      sudo systemctl reload nginx

# ── HTTP server block ─────────────────────────────────────────────────
# Proxies port 80 to tunnelxd's HTTP listener (which sends 301 → HTTPS)
server {
    listen 80;
    listen [::]:80;

    # Match the tunnel domain and all subdomains
    server_name tl.codesky.tech *.tl.codesky.tech;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

