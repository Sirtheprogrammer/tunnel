name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Test Suite
        run: go test -v -count=1 ./...

      - name: Verify Builds
        run: |
          go build -v -o /dev/null ./cmd/tunnelx
          go build -v -o /dev/null ./cmd/tunnelxd

